services:
  - type: web
    name: smart-career-api
    runtime: python
    buildCommand: "pip install --no-cache-dir -r backend/requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
